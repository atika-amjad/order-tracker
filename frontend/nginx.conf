# nginx config for the static SPA (two-subdomain deployment — the browser
# talks to the backend subdomain directly, so nginx only serves static files).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: unknown routes return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed asset files aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
