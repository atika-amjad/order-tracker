# Render Blueprint for the backend (Infrastructure-as-Code).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: order-tracker-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set this in the Render dashboard to your deployed Vercel frontend URL,
      # e.g. https://order-tracker.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
